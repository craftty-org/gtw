name: Dispatch Contributing Policy to automata
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to automata
        env:
          GH_TOKEN: ${{ secrets.AUTOMATA_DISPATCH_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/craftty-org/automata/dispatches" \
            -d "$(jq -n --arg type gtw-contributing-policy --arg repo "${{ github.repository }}" --arg sha "${{ github.event.pull_request.head.sha }}" --arg ref "${{ github.ref }}" --arg event "${{ github.event_name }}" --arg actor "${{ github.actor }}" --arg pr_title "$PR_TITLE" --arg pr_body "$PR_BODY" --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" --argjson pr_number "${{ github.event.pull_request.number }}" '{event_type:$type, client_payload:{repo:$repo, sha:$sha, ref:$ref, event_name:$event, actor:$actor, pr_number:$pr_number, pr_title:$pr_title, pr_body:$pr_body, base_sha:$base_sha, head_sha:$head_sha}}')"
