name: Dispatch CI to automata
on:
  push:
  pull_request:
concurrency:
  group: dispatch-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to automata
        env:
          GH_TOKEN: ${{ secrets.AUTOMATA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          ref="${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/craftty-org/automata/dispatches" \
            -d "$(jq -n --arg type gtw-ci --arg repo "${{ github.repository }}" --arg sha "$sha" --arg ref "$ref" --arg event "${{ github.event_name }}" --arg actor "${{ github.actor }}" '{event_type:$type, client_payload:{repo:$repo, sha:$sha, ref:$ref, event_name:$event, actor:$actor}}')"
